[project]
name = "showme-client"
version = "0.1.0"
description = "ShowMe Mac client (PyQt6 overlay + panel)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqt6>=6.7",
    "mss>=9.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "httpx>=0.27",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-Vision>=10.3",
    "sounddevice>=0.5.6",
    "elevenlabs==2.78.0",
    "pyobjc-framework-avfoundation>=10.3",
    "onnxruntime>=1.32.0",
    "sherpa-onnx>=2.0.1",
    "pyobjc-framework-applicationservices>=10.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
